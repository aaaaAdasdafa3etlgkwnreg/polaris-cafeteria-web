# ===== DATABASE CONFIGURATION - MySQL Local =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:${MYSQL_PORT:3307}/dbPolaris2025?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root1}
spring.datasource.password=${DB_PASSWORD:your_db_password_here}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=${SERVER_PORT:8080}

# ===== JPA / HIBERNATE CONFIGURATION =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===== CONNECTION POOL (HikariCP) =====
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ===== FILE UPLOAD =====
app.upload.dir=./uploads/

# ===== JPA CONFIGURATION =====
spring.jpa.open-in-view=false

# ===== JWT CONFIGURATION =====
jwt.secret=${JWT_SECRET:miClaveSecretaMuySeguraDeAlMenos256BitsParaHS256Que1Tenga32Caracteres}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===== CORS CONFIGURATION =====
spring.web.cors.allowed-origins=http://localhost:4200,https://polaris-frontend.netlify.app
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# ===== RENIEC API =====
reniec.api.url=https://api.decolecta.com/v1/reniec/dni
reniec.api.token=${RENIEC_API_TOKEN:your_reniec_token_here}

# ===== SECURITY =====
security.bcrypt.strength=12

# ===== FILE UPLOAD SIZE =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== DISABLE REDIS =====
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# ===== EMAIL CONFIGURATION (Gmail SMTP) =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_app_password_here}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===== OTP CONFIGURATION =====
otp.expiration.minutes=10
otp.length=6
